# Scanai local infra — $0, NDPR-clean, no Supabase
# Default (light, 8GB laptop safe): postgres + api + minio + mailpit
# Full: docker compose --profile ai --profile observability up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-scanai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-scanai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]
    profiles: [observability]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scanai}:${POSTGRES_PASSWORD:-changeme-dev-only}@postgres:5432/${POSTGRES_DB:-scanai}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme-dev-only}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-changeme-dev-only}
      OLLAMA_URL: http://ollama:11434
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PAYSTACK_SECRET: ${PAYSTACK_SECRET_KEY:-}
    ports: ["${API_PORT:-3001}:3001"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-dev-only}
    volumes: [miniodata:/data]
    ports: ["${MINIO_PORT:-9000}:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-changeme-dev-only};
      mc mb -p local/originals local/exports || true;
      mc anonymous set none local/originals; mc anonymous set none local/exports;
      echo buckets-ready"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["${MAILPIT_SMTP:-1025}:1025", "${MAILPIT_UI:-8025}:8025"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollamadata:/root/.ollama]
    ports: ["11434:11434"]
    profiles: [ai]
    # First run: docker exec scanai-ollama-1 ollama pull qwen2.5:7b

  ocr-api:
    build: ./ocr
    restart: unless-stopped
    ports: ["${OCR_PORT:-8001}:8001"]
    depends_on: [postgres]
    profiles: [ai]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scanai}:${POSTGRES_PASSWORD:-changeme-dev-only}@postgres:5432/${UMAMI_DB:-umami}
      APP_SECRET: ${UMAMI_SECRET:-changeme-dev-only}
      TRACKER_SCRIPT_NAME: umami
    ports: ["${UMAMI_PORT:-3002}:3000"]
    depends_on: [postgres]
    profiles: [observability]

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scanai}:${POSTGRES_PASSWORD:-changeme-dev-only}@postgres:5432/${GLITCHTIP_DB:-glitchtip}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET:-changeme-dev-only}
    ports: ["${GLITCHTIP_PORT:-8000}:8000"]
    depends_on: [postgres, redis]
    profiles: [observability]

volumes:
  pgdata:
  miniodata:
  redisdata:
  ollamadata:
