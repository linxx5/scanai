<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanai — Scan it. Understand it. Use it.</title>
<style>
  :root { --p: #1DA1F2; --bg: #F2FAFF; --tx: #10222E; --card: #FFFFFF; }
  * { box-sizing: border-box; }
  body { font-family: Roboto, Inter, system-ui, sans-serif; background: var(--bg); color: var(--tx); margin: 0; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; }
  .hero { background: linear-gradient(135deg, #1DA1F2, #0B6B4F); color: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; }
  .hero h1 { font-size: 28px; margin: 0 0 8px; }
  .hero p { font-size: 16px; opacity: .95; margin: 0 0 4px; }
  .ask { background: var(--card); border-radius: 16px; padding: 20px; margin-top: -24px; box-shadow: 0 6px 24px rgba(16,34,46,.12); text-align: center; }
  .ask h2 { font-size: 20px; margin: 4px 0 12px; }
  .big { display: block; width: 100%; border: 0; border-radius: 14px; padding: 18px; font-size: 18px; font-weight: 800; margin-top: 12px; min-height: 60px; cursor: pointer; }
  .scan { background: var(--p); color: #fff; }
  .form { background: #fff; color: var(--p); border: 3px solid var(--p); }
  .row { display: grid; grid-template-columns: 1fr; gap: 4px; }
  .pro { margin-top: 20px; background: var(--card); border-radius: 16px; padding: 16px; text-align: center; }
  .pro a { color: var(--p); font-weight: 700; }
  .tiny { text-align: center; color: #5f6b76; font-size: 13px; margin-top: 16px; }
  @media (min-width: 600px) { body { padding: 32px; } .hero h1 { font-size: 36px; } .row { grid-template-columns: 1fr 1fr; gap: 12px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Scanai understands your papers.</h1>
      <p>Snap it. Fix only the weak bits. Save as PDF, Excel, or Word.</p>
      <p>Free. No login. Works offline.</p>
    </div>
    <div class="ask">
      <h2>What do you want to do today?</h2>
      <div class="row">
        <button class="big scan" onclick="location.href='scan.html'">📷 Scan</button>
        <button class="big form" onclick="location.href='forms/fill.html'">📝 Make a Form</button>
      </div>
    </div>
    <div class="pro">
      Need more? <strong>Batch 500, Cloud AI, Sync, Teams.</strong><br>
      <a href="account.html">Make a free account → pick a plan</a>
    </div>
    <p class="tiny">5 free scans. Private papers stay on your phone.</p>
  </div>
</body>
</html>
